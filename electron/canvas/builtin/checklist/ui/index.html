<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Checklist</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="add-row">
        <input id="new-item" type="text" placeholder="Add an item and press Enter" />
        <button type="button" id="add-btn">Add</button>
      </div>
      <ul id="items" class="items" aria-live="polite"></ul>
      <div class="footer">
        <span id="summary"></span>
        <button type="button" id="clear-btn">Clear completed</button>
      </div>
    </div>
    <script src="/aichemist-canvas-client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
