name: release-please

on:
  push:
    branches: [main]
  # Also fired by the `publish` job below (a release published with GITHUB_TOKEN
  # doesn't trigger workflows itself).
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        # Config (release-please-config.json) creates the GitHub Release as a
        # *draft*, so auto-updating clients can't see it until the `publish`
        # job below flips it public after every installer + latest*.yml is up.
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build & publish (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-flag: --win
          - os: macos-latest
            builder-flag: --mac
          - os: ubuntu-latest
            builder-flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A draft release has no git tag yet (GitHub creates it on publish),
          # so check out the release commit instead of the tag.
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      # electron-builder publishes straight to the tag's GitHub Release
      # (already created by release-please): installers plus the
      # latest.yml/latest-mac.yml/latest-linux.yml manifests electron-updater
      # reads to discover new versions.
      - name: Package & publish (${{ matrix.os }})
        run: bunx electron-builder ${{ matrix.builder-flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Runs only when every platform's build + upload succeeded, so a failed
  # matrix leaves the release as an unpublished draft instead of a public
  # release whose latest*.yml 404s (issue #256).
  publish:
    name: Publish release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      # release-please opens the *next* release PR the moment a release PR
      # merges, while the new release is still an untagged draft it can't see,
      # so that PR is built against a stale baseline (the whole history as
      # "unreleased"). Once the release is published and tagged, close it and
      # re-run release-please: it recreates the PR from the right baseline when
      # there are user-facing commits, and otherwise leaves nothing open (a bare
      # re-run would just skip and keep the stale PR).
      - name: Reset the open release PR
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Closing: it was built before ${TAG} was tagged. release-please will reopen it from the correct baseline."
          done
          gh workflow run release-please.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
