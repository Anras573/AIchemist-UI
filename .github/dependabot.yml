version: 2
updates:
  # Keep the agent/provider SDKs current so new models work as soon as the
  # SDKs ship support. Grouped into a single PR; checked daily.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    # Only the SDKs below; everything else is updated manually.
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      - dependency-name: "@anthropic-ai/sdk"
      - dependency-name: "@github/copilot-sdk"
      - dependency-name: "@openai/codex-sdk"
      - dependency-name: "@modelcontextprotocol/sdk"
      - dependency-name: "ai"
      - dependency-name: "@ai-sdk/openai-compatible"
      - dependency-name: "ollama"
      - dependency-name: "tokenlens"
    groups:
      agent-sdks:
        patterns:
          - "@anthropic-ai/*"
          - "@github/copilot-sdk"
          - "@openai/codex-sdk"
          - "@modelcontextprotocol/sdk"
          - "ai"
          - "@ai-sdk/*"
          - "ollama"
          - "tokenlens"
    # Conventional Commits so release-please picks the bump up as a patch release.
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 3
