appId: dev.aichemist.app
productName: AIchemist
directories:
  output: release
publish:
  provider: github
  owner: Anras573
  repo: AIchemist-UI
  # release-please publishes the GitHub Release (non-draft) before this
  # workflow runs, so electron-builder must target that existing published
  # release rather than its default of creating/managing a draft — otherwise
  # it refuses to upload assets ("existing type not compatible with
  # publishing type") and every install artifact silently gets skipped.
  releaseType: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
deb:
  compression: gz
